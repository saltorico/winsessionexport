
  name: Build Windows exporter

  on:
    workflow_dispatch:
    push:
      branches: [main]

  permissions:
    contents: read

  jobs:
    build:
      runs-on: windows-2022
      steps:
        - name: Check out source
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            cache: pip
            cache-dependency-path: requirements-build-windows.txt

        - name: Build and test Windows executable
          shell: pwsh
          run: ./build_windows.ps1

        - name: Upload executable
          uses: actions/upload-artifact@v4
          with:
            name: SessionChatExporter-windows-x64
            path: dist/SessionChatExporter.exe
            if-no-files-found: error

